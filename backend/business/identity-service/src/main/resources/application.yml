spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:3005/nexus_identity
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

management:
  endpoint:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO


